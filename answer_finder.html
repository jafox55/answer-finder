<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cross-Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #e2d5b3;
    --paper-2: #d7c69c;
    --paper-edge: #c7b489;
    --ink: #2b2015;
    --ink-faint: #6e5e44;
    --rule: rgba(43,32,21,0.22);
    --stamp: #9a3a2c;
    --stamp-dark: #7c2e22;
    --verified: #3c5c58;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
  }
  body {
    background: var(--paper-edge);
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.025) 0px, rgba(0,0,0,0.025) 1px, transparent 1px, transparent 3px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 1px, transparent 1px, transparent 3px);
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--paper);
    border: 1px solid var(--paper-edge);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.4) inset,
      0 22px 45px rgba(30,20,10,0.28),
      0 3px 8px rgba(30,20,10,0.18);
    position: relative;
    padding: 0 28px 28px;
    border-radius: 20px;
  }
  .punch {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--paper-edge);
    box-shadow: inset 0 2px 3px rgba(30,20,10,0.35), 0 1px 0 rgba(255,255,255,0.4);
  }
  .tab {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 44px 0 12px;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 22px;
  }
  .tab-label {
    font-family: 'Special Elite', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .tab-serial {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
    border: 1px solid var(--ink-faint);
    padding: 2px 6px;
    border-radius: 2px;
  }
  h1 {
    font-family: 'Special Elite', monospace;
    font-weight: 400;
    font-size: 25px;
    line-height: 1.25;
    margin: 0 0 16px;
    color: var(--ink);
  }
  .sub {
    font-size: 14px;
    color: var(--ink-faint);
    margin: 0 0 28px;
    line-height: 1.55;
    font-style: italic;
  }
  .fields {
    display: flex;
    gap: 18px;
    margin-bottom: 6px;
  }
  .field {
    flex: 1;
    text-align: center;
  }
  .field label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 10px;
  }
  .field input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 2.5px solid var(--stamp-dark);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    font-weight: 500;
    text-align: center;
    padding: 8px 2px 8px;
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus { border-bottom-color: var(--stamp); }
  .field input.err { border-bottom-color: var(--stamp); border-bottom-style: dashed; }

  .hint {
    text-align: center;
    font-size: 12px;
    color: var(--ink-faint);
    margin: 25px 0 24px;
    min-height: 16px;
    font-family: 'JetBrains Mono', monospace;
  }
  .hint.err { color: var(--stamp); }

  button.stamp {
    display: block;
    width: 100%;
    background: transparent;
    color: var(--stamp);
    border: 2.5px solid var(--stamp);
    border-radius: 3px;
    font-family: 'Special Elite', monospace;
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 13px;
    cursor: pointer;
    transition: transform 0.08s, background 0.15s, color 0.15s;
  }
  button.stamp:hover { background: rgba(154,58,44,0.06); }
  button.stamp:active { transform: scale(0.97) rotate(-0.5deg); }

  .result {
    margin-top: 26px;
    padding-top: 22px;
    border-top: 2px dashed var(--rule);
    text-align: center;
    display: none;
  }
  .result.show { display: block; }
  .result-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--verified);
    margin-bottom: 8px;
  }
  .result-stamp {
    display: inline-block;
    transform-origin: center center;
    will-change: transform, opacity;
  }
  .result-stamp.is-animating {
    animation: thud 0.32s cubic-bezier(.2,1.6,.4,1);
    animation-fill-mode: both;
  }
  @keyframes thud {
    0% { transform: rotate(9deg) scale(1.7); opacity: 0; }
    60% { opacity: 1; }
    100% { transform: rotate(-3deg) scale(1); opacity: 1; }
  }
  .result-number {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 34px;
    letter-spacing: 0.04em;
    line-height: 1;
    color: var(--stamp);
    text-transform: uppercase;
    border: 3px solid var(--stamp);
    border-radius: 6px;
    padding: 0 24px;
    min-width: 140px;
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .result-cards {
    margin-top: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-faint);
  }

  footer {
    text-align: center;
    margin-top: 22px;
    font-size: 11px;
    color: var(--ink-faint);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.04em;
  }

  @media (max-width: 480px) {
    .fields {
      gap: 18px;
    }

    .field {
      flex: 0 1 32%;
      min-width: 0;
    }

    .field input {
      background: #d8caa6;
      border-radius: 8px 8px 0 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .result-stamp.is-animating { animation: none; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="punch"></div>
    <div class="tab">
      <span class="tab-label">For Use with "Word for Word"</span>
    </div>

    <h1>Answer Key</h1>

    <div class="fields">
      <div class="field">
        <label>Card A</label>
        <input type="text" id="cardA" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off">
      </div>
      <div class="field">
        <label>Card B</label>
        <input type="text" id="cardB" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off">
      </div>
      <div class="field">
        <label>Card C</label>
        <input type="text" id="cardC" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off">
      </div>
    </div>
    <div class="hint" id="hint">(three different cards, numbered 1-50)</div>

    <button class="stamp" id="revealBtn">Find it</button>

    <div class="result" id="result">
      <div class="result-label">Verified match</div>
      <div class="result-stamp" id="resultStamp">
        <div class="result-number" id="resultNumber">&mdash;</div>
      </div>
      <div class="result-cards" id="resultCards"></div>
    </div>
  </div>

const inputs = [document.getElementById('cardA'), document.getElementById('cardB'), document.getElementById('cardC')];
const hint = document.getElementById('hint');
const btn = document.getElementById('revealBtn');
const result = document.getElementById('result');
const resultStamp = document.getElementById('resultStamp');
const resultNumber = document.getElementById('resultNumber');
const resultCards = document.getElementById('resultCards');

function validate() {
  const vals = inputs.map(i => i.value.trim());
  inputs.forEach(i => i.classList.remove('err'));

  if (vals.some(v => v === '')) {
    hint.textContent = '(three different cards, numbered 1–50)';
    hint.classList.remove('err');
    return null;
  }

  const nums = vals.map(Number);

  for (let i = 0; i < 3; i++) {
    if (!Number.isInteger(nums[i]) || nums[i] < 1 || nums[i] > 50) {
      inputs[i].classList.add('err');
    }
  }
  if (nums.some(n => !Number.isInteger(n) || n < 1 || n > 50)) {
    hint.textContent = 'each card must be a whole number from 1 to 50';
    hint.classList.add('err');
    return null;
  }

  const uniq = new Set(nums);
  if (uniq.size !== 3) {
    inputs.forEach((inp, i) => {
      if (nums.filter(n => n === nums[i]).length > 1) inp.classList.add('err');
    });
    hint.textContent = 'pick three different cards, not the same one multiple times';
    hint.classList.add('err');
    return null;
  }

  hint.textContent = '(three different cards, numbered 1–50)';
  hint.classList.remove('err');
  return nums.sort((a, b) => a - b);
}

function lookupAnswer(sorted) {
  const [a, b, c] = sorted;
  try {
    return LOOKUP[a][b][c];
  } catch (e) {
    return null;
  }
}

btn.addEventListener('click', () => {
  const sorted = validate();
  if (!sorted) {
    result.classList.remove('show');
    return;
  }
  const answer = lookupAnswer(sorted);
  if (answer === null) {
    hint.textContent = 'that combination was not found';
    hint.classList.add('err');
    result.classList.remove('show');
    return;
  }
  result.classList.remove('show');
  resultStamp.classList.remove('is-animating');
  void resultStamp.offsetWidth;
  resultStamp.classList.add('is-animating');
  resultNumber.textContent = answer;
  resultCards.textContent = `Cards ${sorted[0]}, ${sorted[1]} & ${sorted[2]}`;
  result.classList.add('show');
});

inputs.forEach((inp, idx) => {
  // strip anything non-numeric as the person types, then auto-advance
  // once two digits are in the box
  inp.addEventListener('input', () => {
    const digitsOnly = inp.value.replace(/[^0-9]/g, '').slice(0, 2);
    inp.value = digitsOnly;
    if (digitsOnly.length === 2 && idx < inputs.length - 1) {
      inputs[idx + 1].focus();
      inputs[idx + 1].select();
    }
  });

  // backspace on an empty box jumps back to the previous box
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      btn.click();
      return;
    }
    if (e.key === 'Backspace' && inp.value === '' && idx > 0) {
      e.preventDefault();
      inputs[idx - 1].focus();
      inputs[idx - 1].value = inputs[idx - 1].value.slice(0, -1);
    }
  });

  // selecting a box (e.g. tapping in on mobile) selects its contents,
  // so typing immediately replaces rather than appends
  inp.addEventListener('focus', () => inp.select());
});
