const inputs = [document.getElementById('cardA'), document.getElementById('cardB'), document.getElementById('cardC')];
const hint = document.getElementById('hint');
const btn = document.getElementById('revealBtn');
const result = document.getElementById('result');
const resultStamp = document.getElementById('resultStamp');
const resultNumber = document.getElementById('resultNumber');
const resultCards = document.getElementById('resultCards');

function validate() {
  const vals = inputs.map(i => i.value.trim());
  inputs.forEach(i => i.classList.remove('err'));

  if (vals.some(v => v === '')) {
    hint.textContent = '(three different cards, numbered 1-50)';
    hint.classList.remove('err');
    return null;
  }

  const nums = vals.map(Number);

  for (let i = 0; i < 3; i++) {
    if (!Number.isInteger(nums[i]) || nums[i] < 1 || nums[i] > 50) {
      inputs[i].classList.add('err');
    }
  }
  if (nums.some(n => !Number.isInteger(n) || n < 1 || n > 50)) {
    hint.textContent = 'each card must be a whole number from 1 to 50';
    hint.classList.add('err');
    return null;
  }

  const uniq = new Set(nums);
  if (uniq.size !== 3) {
    inputs.forEach((inp, i) => {
      if (nums.filter(n => n === nums[i]).length > 1) inp.classList.add('err');
    });
    hint.textContent = 'pick three different cards, not the same one multiple times';
    hint.classList.add('err');
    return null;
  }

  hint.textContent = '(three different cards, numbered 1-50)';
  hint.classList.remove('err');
  return nums.sort((a, b) => a - b);
}

function lookupAnswer(sorted) {
  const [a, b, c] = sorted;
  try {
    return LOOKUP[a][b][c];
  } catch (e) {
    return null;
  }
}

btn.addEventListener('click', () => {
  const sorted = validate();
  if (!sorted) {
    result.classList.remove('show');
    return;
  }
  const answer = lookupAnswer(sorted);
  if (answer === null) {
    hint.textContent = 'that combination was not found';
    hint.classList.add('err');
    result.classList.remove('show');
    return;
  }
  result.classList.remove('show');
  resultStamp.classList.remove('is-animating');
  void resultStamp.offsetWidth;
  resultStamp.classList.add('is-animating');
  resultNumber.textContent = answer;
  resultCards.textContent = `Cards ${sorted[0]}, ${sorted[1]} & ${sorted[2]}`;
  result.classList.add('show');
});

inputs.forEach((inp, idx) => {
  // strip anything non-numeric as the person types, then auto-advance
  // once two digits are in the box
  inp.addEventListener('input', () => {
    const digitsOnly = inp.value.replace(/[^0-9]/g, '').slice(0, 2);
    inp.value = digitsOnly;
    if (digitsOnly.length === 2 && idx < inputs.length - 1) {
      inputs[idx + 1].focus();
      inputs[idx + 1].select();
    }
  });

  // backspace on an empty box jumps back to the previous box
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      btn.click();
      return;
    }
    if (e.key === 'Backspace' && inp.value === '' && idx > 0) {
      e.preventDefault();
      inputs[idx - 1].focus();
      inputs[idx - 1].value = inputs[idx - 1].value.slice(0, -1);
    }
  });

  // selecting a box (e.g. tapping in on mobile) selects its contents,
  // so typing immediately replaces rather than appends
  inp.addEventListener('focus', () => inp.select());
});
